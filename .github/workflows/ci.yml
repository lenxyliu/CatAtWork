name: Required checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
      - name: Validate change evidence
        if: github.event_name == 'pull_request'
        env:
          GOVERNANCE_TRIVIAL: ${{ contains(github.event.pull_request.labels.*.name, 'governance:trivial') }}
        run: python3 Scripts/check_governance.py --base "${{ github.event.pull_request.base.sha }}"
      - name: Validate pushed change evidence
        if: github.event_name == 'push'
        run: python3 Scripts/check_governance.py --base "${{ github.event.before }}"
      - name: Governance checker fixtures
        run: python3 -B -m unittest discover -s Scripts/tests -p 'test_check_governance.py'

  swift:
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: Scripts/requirements-validation.txt
      - name: Install validation dependencies
        run: python3 -m pip install --requirement Scripts/requirements-validation.txt
      - name: Toolchain identity
        run: |
          xcodebuild -version
          swift --version
          python3 --version
          python3 -c 'import PIL; print("Pillow", PIL.__version__)'
      - name: Visual QA fixture gates
        run: >-
          python3 -B -m unittest
          Scripts.tests.test_visual_qa
          Scripts.tests.test_asset_contract
      - name: Swift build
        run: swift build
      - name: Swift unit tests
        run: swift test
      - name: Package and source validation
        run: |
          bash Scripts/typecheck_without_xcode.sh
          python3 Scripts/validate_high_frame_pet.py \
            --manifest Sources/CatAtWork/Resources/DefaultPet.catpet/manifest.json \
            --report /private/tmp/catatwork-high-frame-report.json
          python3 Scripts/validate_visual_qa.py \
            --manifest Sources/CatAtWork/Resources/DefaultPet.catpet/manifest.json \
            --source-root Assets/CatAtWork \
            --contract Tests/Fixtures/VisualQA/default-pet-b1-contract.json \
            --supplemental Tests/Fixtures/VisualQA/default-pet-b1-supplemental.json \
            --mode baseline \
            --report /private/tmp/catatwork-visual-qa-baseline.json
          if python3 Scripts/validate_visual_qa.py \
            --manifest Sources/CatAtWork/Resources/DefaultPet.catpet/manifest.json \
            --source-root Assets/CatAtWork \
            --contract Tests/Fixtures/VisualQA/default-pet-b1-contract.json \
            --supplemental Tests/Fixtures/VisualQA/default-pet-b1-supplemental.json \
            --mode release \
            --report /private/tmp/catatwork-visual-qa-release.json; then
            echo "known-defective package unexpectedly passed release mode" >&2
            exit 1
          fi
